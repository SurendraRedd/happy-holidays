name: Ping Streamlit App to Keep Awake

on:
  schedule:
    - cron: '*/45 * * * *'  # Every 45 minutes (safe within 12-hour window; GitHub minimum interval is 5 minutes)
  workflow_dispatch:  # Allows manual triggering for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping to app
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://happy-holidays-everyone.streamlit.app
