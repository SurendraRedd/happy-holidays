name: Keep Streamlit Alive
on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        run: |
          # First request to wake the app
          curl -s -o /dev/null -w "Wake: %{http_code}\n" \
          "https://happy-holidays-everyone.streamlit.app?_st=$(date +%s)"
          
          # Wait 5 seconds
          sleep 5
          
          # Second request to ensure it's loaded
          curl -s -o /dev/null -w "Confirm: %{http_code}\n" \
          "https://happy-holidays-everyone.streamlit.app"
          
          echo "App pinged at $(date)"
